openapi: 3.1.0
info:
  title: tripmap viewer chat tools
  version: 0.1.0
  description: |
    In-process tools for the signed-in trip viewer chat agent. Paths are
    schema-only (not HTTP routes); operationId is the function tool name.
paths:
  /chat/get_trip_summary:
    get:
      operationId: get_trip_summary
      summary: Get a compact summary of the open trip (titles, day count)
      responses:
        "200":
          description: Trip summary JSON
  /chat/get_schema:
    get:
      operationId: get_schema
      summary: Get the itinerary YAML schema and patch operation hints
      responses:
        "200":
          description: Schema hints JSON
  /chat/get_trip_yaml:
    get:
      operationId: get_trip_yaml
      summary: Fetch the current itinerary YAML (may be truncated for large trips)
      description: Prefer summary plus targeted patches over full YAML when possible.
      responses:
        "200":
          description: YAML text or truncated payload
  /chat/get_day:
    post:
      operationId: get_day
      summary: Get one day's title, notes, and stop place ids/titles/types
      description: Use for the CURRENT VIEWER DAY before editing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day]
              properties:
                day:
                  type: integer
                  description: 1-based day number
      responses:
        "200":
          description: Day detail JSON
  /chat/set_day_photo:
    post:
      operationId: set_day_photo
      summary: Set a day's hero photo via Commons query or photo URL
      description: |
        Prefer query (Commons search). When replacing a photo, pass query again —
        the server skips the day's current image. Returns the new photo URL in
        tool JSON only (do not paste it into chat).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day]
              properties:
                day:
                  type: integer
                  description: 1-based day number
                query:
                  type: string
                  description: Commons search query when you do not have a URL yet
                photo:
                  type: string
                  description: Optional direct https image URL or Commons File URL
                photo_caption:
                  type: string
                  description: Short caption for the photo
      responses:
        "200":
          description: ok + verify
  /chat/patch_trip:
    post:
      operationId: patch_trip
      summary: Apply a structured itinerary patch
      description: |
        remove_stop example {day, list:"stops", places:["hellobeasty","Hawthorn Lounge"]}.
        places.*.maps_url must be a Google Maps URL. For day photos use set_day_photo instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patch]
              properties:
                patch:
                  type: object
                  description: >
                    Patch object keys may include update_day, places, upsert_stop,
                    remove_stop (place or places[]), swap_days, insert_day, delete_day, days
                  additionalProperties: true
      responses:
        "200":
          description: ok + verify

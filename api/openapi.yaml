openapi: 3.1.0
info:
  title: tripmap agent API
  version: 0.4.2
  description: |
    Authenticated itinerary API (MCP tools + optional REST). Schema v2: places
    catalog plus day route/stops as place refs. Notes are human-authored —
    put enrichment in places.id.info, not notes (usage rule, not enforced).
    Use update_day to change a day's title/notes/hike/ferry when the user asks.
    Human viewers sign in with Hellō, then use /me/trips/{id}/ (no capability tokens).
    Operations may set x-audiences (mcp and/or chat); viewer chat loads audience=chat only.
servers:
  - url: "{{BASE_URL}}"
paths:
  /health:
    get:
      operationId: health
      summary: Liveness
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/agent/schema:
    get:
      operationId: getSchema
      summary: Itinerary schema and version
      x-audiences: [mcp, chat]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaInfo"
        "401":
          description: Unauthorized
  /api/agent/trips:
    get:
      operationId: listTrips
      summary: List itinerary IDs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Trip ID list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripList"
        "401":
          description: Unauthorized
    post:
      operationId: createTrip
      summary: Create itinerary
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutateResult"
        "401":
          description: Unauthorized
  /api/agent/trips/{id}:
    get:
      operationId: getTrip
      summary: Compact trip title card (not full routes)
      description: |
        Returns id, title, description, start, day count — not per-day routes.
        For overnight/endpoint edits use getTripYAML with scope=full (source of
        truth) then replaceDayRoutes. Prefer getTripYAML over getTrip when you
        need stops; chat defaults to day-neighborhood scope.
      x-audiences: [mcp, chat]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripSummary"
        "404":
          description: Not found
    patch:
      operationId: patchTrip
      summary: Patch places info, day narrative, or structure
      description: Prefer over putTripYAML. Use update_day for title/notes/hike/ferry. Enrich via places.id.info. Also upsert_stop, remove_stop on the stops list (mid-day venues, rental desks, restaurants — list must be "stops", not "route"). In viewer chat, overnight/endpoint and days.*.route / swap_days / delete_day / insert_day are rejected — use changeOvernight or replaceDayRoutes for those only. Do not put enrichment in notes. For day hero photos from Commons search, use setDayPhoto in viewer chat.
      x-audiences: [mcp, chat]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutateResult"
  /api/agent/trips/{id}/yaml:
    get:
      operationId: getTripYAML
      summary: Get itinerary YAML (day neighborhood by default in chat)
      description: |
        Source of truth for routes/stops before edits.
        In viewer chat, omit scope (or pass scope=day) to get days day-1..day+1
        plus only places referenced by those days — enough for stop/notes/hours
        edits on the current day. Pass scope=full for the entire itinerary
        (overnight/endpoint changes, cross-day lookup, or structural work).
        HTTP GET with no query params still returns the full YAML (compat).
      x-audiences: [mcp, chat]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: |
            day = neighborhood YAML (days N±1 + referenced places).
            full = entire itinerary. Chat tools default to day when a viewer day is known.
          schema:
            type: string
            enum: [day, full]
        - name: day
          in: query
          required: false
          description: Center day for scope=day (chat defaults to the viewer day).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: YAML document
          content:
            text/plain:
              schema:
                type: string
    put:
      operationId: putTripYAML
      summary: Replace YAML (raw text body)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: Full itinerary YAML
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutateResult"
  /api/agent/trips/{id}/versions:
    get:
      operationId: listVersions
      summary: List YAML versions
      description: |
        Newest first. Each entry has version_id, last_modified, and is_latest.
        To undo only the latest change, call restoreVersion with the first entry
        where is_latest is false (usually the second row) — never restore the
        is_latest tip (that rewrites the same broken tip).
      x-audiences: [mcp, chat]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionList"
  /api/agent/trips/{id}/versions/{version_id}:
    get:
      operationId: getVersion
      summary: Get YAML for a prior version
      description: |
        Read-only fetch of a historical revision. Call listVersions first.
        Prefer this over restoreVersion when inspecting history.
      x-audiences: [mcp, chat]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: YAML document for that version
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Not found
  /api/agent/trips/{id}/restore:
    post:
      operationId: restoreVersion
      summary: Restore a prior YAML version
      description: |
        Restores TO the given version_id (makes that revision current). To undo
        only the latest change: call listVersions, then restoreVersion with the
        first entry where is_latest is false (usually the second row) — never
        the current/latest id. Prefer changeOvernight for overnight edits rather
        than restore unless the user asked to undo.
      x-audiences: [mcp, chat]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutateResult"
  /api/agent/trips/{id}/day-routes:
    post:
      operationId: replaceDayRoutes
      summary: Replace full day routes (overnight / endpoint changes)
      description: |
        Replace the full route array for one or more days in a single call.
        Use this for overnight or day-endpoint changes — include both day N and
        day N+1 when continuity matters, with updated titles. For day N+1, keep
        existing mid/end stops; only change the start place — do not collapse a
        travel day to a single stop. Set each route[].type to the day role:
        lodging ends overnight (not via/depart), road waypoints via, sights
        attraction/etc. Optional places creates/updates the catalog in the same
        request. Do not use upsert_stop or swap_days for this.
      x-audiences: [mcp, chat]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceDayRoutesRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutateResult"
  /api/chat/trips/{id}/day/photo:
    post:
      operationId: setDayPhoto
      summary: Set a day's hero photo via Commons query or photo URL
      description: |
        Viewer-chat only. Prefer query (Commons search). When replacing a photo,
        pass query again — the server skips the day's current image. Returns the
        new photo URL in tool JSON only (do not paste it into chat).
      x-audiences: [chat]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day]
              properties:
                day:
                  type: integer
                  description: 1-based day number
                query:
                  type: string
                  description: Commons search query when you do not have a URL yet
                photo:
                  type: string
                  description: Optional direct https image URL or Commons File URL
                photo_caption:
                  type: string
                  description: Short caption for the photo
      responses:
        "200":
          description: ok with day photo fields
  /api/chat/trips/{id}/change-overnight:
    post:
      operationId: changeOvernight
      summary: Change a day's overnight endpoint (transactional)
      description: |
        Viewer-chat preferred tool for overnight/endpoint changes. Rewrites day N's
        route end to new_end (type overnight) and, by default, day N+1's route start
        to the same place while preserving day N+1 mid/end stops. Creates one version.
        Rejects absurd single-day distances unless force=true (ferry/flight). For
        multi-stop route surgery use replaceDayRoutes instead. Do not use patchTrip
        upsert_stop/swap_days for overnight changes.
      x-audiences: [chat]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOvernightRequest"
      responses:
        "200":
          description: Updated with semantic mutate result
          content:
            application/json:
              schema:
                type: object
  /api/chat/preferences:
    get:
      operationId: listPreferences
      summary: List standing user preferences for viewer chat
      description: |
        Viewer-chat only. Preferences are per Hellō user (not per trip) and are
        also injected into the system prompt each turn.
      x-audiences: [chat]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preference list
    post:
      operationId: savePreference
      summary: Save or update a standing user preference
      description: |
        Viewer-chat only. Ask the user before calling. Preferences are user taste
        (diet, pace, budget) — not how to operate tools. Upsert by id when provided;
        otherwise a new id is generated.
      x-audiences: [chat]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                preference_id:
                  type: string
                  description: Optional existing preference id to update
                text:
                  type: string
                  description: Short standing preference statement
                tags:
                  type: array
                  items:
                    type: string
                  description: Optional tags e.g. food, pace
      responses:
        "200":
          description: Saved preference
  /api/chat/preferences/{preference_id}:
    delete:
      operationId: forgetPreference
      summary: Delete a standing user preference
      description: Viewer-chat only. Ask the user before calling.
      x-audiences: [chat]
      security:
        - bearerAuth: []
      parameters:
        - name: preference_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
  /api/chat/learnings:
    get:
      operationId: listLearnings
      summary: List agent learnings for viewer chat
      description: |
        Viewer-chat only. Agent learnings are per Hellō user (not per trip): durable
        rules about how to operate the app (tools, types, undo). Distinct from
        standing preferences (user taste). Also injected into the system prompt.
      x-audiences: [chat]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Learning list
    post:
      operationId: saveLearning
      summary: Save or update an agent learning
      description: |
        Viewer-chat only. Ask the user before calling. Use for procedural corrections
        (how to edit), not taste. Upsert by learning_id when provided.
      x-audiences: [chat]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                learning_id:
                  type: string
                  description: Optional existing learning id to update
                text:
                  type: string
                  description: Short reusable operating rule
                tags:
                  type: array
                  items:
                    type: string
                  description: Optional tags e.g. tools, types, undo
      responses:
        "200":
          description: Saved learning
  /api/chat/learnings/{learning_id}:
    delete:
      operationId: forgetLearning
      summary: Delete an agent learning
      description: Viewer-chat only. Ask the user before calling.
      x-audiences: [chat]
      security:
        - bearerAuth: []
      parameters:
        - name: learning_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
    SchemaInfo:
      type: object
      properties:
        schema_version:
          type: integer
        description:
          type: string
        notes_policy:
          type: string
          description: Human-authored notes usage rule for agents (not enforced)
        fields:
          type: object
          additionalProperties:
            type: string
        patch_ops:
          type: array
          items:
            type: string
        days_patch_example:
          type: object
          additionalProperties: true
    TripList:
      type: object
      properties:
        trips:
          type: array
          items:
            type: string
    CreateTripRequest:
      type: object
      required:
        - id
        - yaml
      properties:
        id:
          type: string
        yaml:
          type: string
    TripSummary:
      type: object
      properties:
        id:
          type: string
        version_id:
          type: string
        schema_version:
          type: integer
        trip:
          type: string
        description:
          type: string
        start:
          type: string
        days:
          type: integer
    TripPatch:
      type: object
      additionalProperties: false
      description: |
        One or more structured ops. Prefer update_day for day narrative and
        places.<id>.info for enrichment. Day calendar dates are derived from
        trip.start + (day − 1) when start is set — do not patch per-day dates.
      properties:
        swap_days:
          type: array
          description: >
            Exactly two day numbers whose entire day bodies are exchanged (reorder).
            Do not use for changing an overnight or day endpoint — that needs route
            edits on the affected days (and the next day's start), not a swap.
          items:
            type: integer
          minItems: 2
          maxItems: 2
        update_day:
          $ref: "#/components/schemas/UpdateDay"
        places:
          type: object
          description: >
            Map of kebab-case place id to partial place fields. For a new place,
            title, lat, lon, and type are required at the top level of that object.
            Never put title under info — info is structured enrichment only
            (see PlaceInfo) and is deep-merged.
          additionalProperties:
            $ref: "#/components/schemas/PlacePatch"
        days:
          type: object
          description: >
            Day-number string keys (e.g. "10") to partial day updates. Prefer
            update_day for title/notes alone. To change an overnight or reorder
            a route — especially when the next day's start must change too —
            prefer replaceDayRoutes. Include title (and notes if the narrative
            should change) on those days.
          additionalProperties:
            $ref: "#/components/schemas/DayPatch"
        upsert_stop:
          $ref: "#/components/schemas/UpsertStop"
        remove_stop:
          $ref: "#/components/schemas/RemoveStop"
        delete_day:
          type: integer
        insert_day:
          $ref: "#/components/schemas/InsertDay"
    UpdateDay:
      type: object
      additionalProperties: false
      description: Partial update of one existing day (omit fields to leave unchanged)
      required:
        - day
      properties:
        day:
          type: integer
        title:
          type: string
        notes:
          type: string
          description: Day narrative; set when the user asks to edit notes
        hike:
          type: boolean
        ferry:
          type: boolean
        photo:
          type: string
        photo_caption:
          type: string
    PlacePatch:
      type: object
      additionalProperties: false
      description: Partial place catalog upsert (top-level identity fields + optional PlaceInfo)
      properties:
        title:
          type: string
          description: Display name; required on the place for new ids (not under info)
        lat:
          type: number
        lon:
          type: number
        type:
          type: string
          description: e.g. overnight, restaurant, attraction, via
        notes:
          type: string
        photo:
          type: string
        photo_caption:
          type: string
        maps_url:
          type: string
          description: Google Maps place URL for the viewer pin; when set, overrides lat/lon search
        info:
          $ref: "#/components/schemas/PlaceInfo"
    DayPatch:
      type: object
      additionalProperties: false
      description: Partial day body (prefer update_day for title/notes alone)
      properties:
        title:
          type: string
        notes:
          type: string
          description: Day narrative; set when the overnight or story changes
        hike:
          type: boolean
        ferry:
          type: boolean
        route:
          type: array
          description: Full replacement of that day's route (ordered place refs)
          items:
            $ref: "#/components/schemas/StopRef"
        stops:
          type: array
          description: Full replacement of that day's stops list
          items:
            $ref: "#/components/schemas/StopRef"
    UpsertStop:
      type: object
      additionalProperties: false
      description: >
        Add or update a stop ref by place id. For restaurants, bars, rental desks,
        and other mid-day venues ALWAYS use list "stops" (with places.* in the same
        patch). list "route" is only for updating an existing mid-route via/sight
        already on the drive — never for new venues (chat rejects that and tells you
        to retry with list stops). For overnight/endpoint or full route replacement,
        use changeOvernight or replaceDayRoutes instead. place must be a kebab-case
        id that exists in places (not a display title).
      properties:
        day:
          type: integer
        list:
          type: string
          description: >
            "stops" for mid-day venues/logistics (default choice). "route" only when
            updating an existing mid-drive via/sight already on that day's route.
        place:
          type: string
          description: Kebab-case place id from places (e.g. greymouth), not a display title
        type:
          type: string
        notes:
          type: string
        maps_url:
          type: string
          description: Optional Google Maps URL override on this stop ref
    RemoveStop:
      type: object
      additionalProperties: false
      description: >
        Remove one or more place refs from route and/or stops. Use when
        replacing a day's overnight — remove the old end before upserting the new one.
      properties:
        day:
          type: integer
        list:
          type: string
          description: route, stops, or empty for both
        place:
          type: string
          description: Place id or exact title
        places:
          type: array
          items:
            type: string
          description: Several place ids or exact titles
    InsertDay:
      type: object
      additionalProperties: false
      properties:
        after:
          type: integer
        day:
          type: object
          additionalProperties: false
          properties:
            title:
              type: string
            notes:
              type: string
              description: Human-authored; agents should not set unless asked
            hike:
              type: boolean
            ferry:
              type: boolean
            route:
              type: array
              items:
                $ref: "#/components/schemas/StopRef"
            stops:
              type: array
              items:
                $ref: "#/components/schemas/StopRef"
    PlaceInfo:
      type: object
      additionalProperties: false
      description: >
        Structured enrichment for a place (optional throughout). Does not include
        title, lat, lon, or type — those belong on the place object itself.
        Opening hours belong in logistics.opening_hours (not under stats).
      properties:
        source:
          $ref: "#/components/schemas/PlaceSource"
        links:
          type: array
          items:
            $ref: "#/components/schemas/PlaceLink"
        stats:
          $ref: "#/components/schemas/PlaceStats"
        logistics:
          $ref: "#/components/schemas/PlaceLogistics"
        facilities:
          $ref: "#/components/schemas/PlaceFacilities"
        warnings:
          type: array
          items:
            type: string
        highlights:
          type: array
          items:
            type: string
    PlaceSource:
      type: object
      additionalProperties: false
      properties:
        generated_by:
          type: string
        generated_at:
          type: string
    PlaceLink:
      type: object
      additionalProperties: false
      required:
        - type
        - url
      properties:
        type:
          type: string
        title:
          type: string
        url:
          type: string
    PlaceStats:
      type: object
      additionalProperties: false
      description: Trail/drive statistics only — not opening hours
      properties:
        distance_km:
          type: number
        duration:
          type: string
        ascent_m:
          type: number
        difficulty:
          type: string
    PlaceLogistics:
      type: object
      additionalProperties: false
      properties:
        parking:
          type: string
        opening_hours:
          type: string
          description: Human-readable opening hours (e.g. Daily 10:00–22:30)
        booking_required:
          type: boolean
    PlaceFacilities:
      type: object
      additionalProperties: false
      properties:
        toilets:
          type: boolean
        drinking_water:
          type: boolean
    StopRef:
      type: object
      additionalProperties: false
      properties:
        place:
          type: string
          description: Kebab-case place id from places
        type:
          type: string
          description: >
            Day-local role for this stop on the route (overrides places.*.type).
            Travel day: first and last lodging = overnight (never via; never
            depart — the viewer shows Depart on the morning start). Mid road
            waypoints = via. Sights = attraction, viewpoint, trailhead, etc.
        notes:
          type: string
        maps_url:
          type: string
          description: Optional per-stop Google Maps URL override for the viewer pin
      required:
        - place
    MutateResult:
      type: object
      properties:
        id:
          type: string
        version_id:
          type: string
        schema_version:
          type: integer
        viewer_url:
          type: string
          description: Signed-in tripmap viewer path /me/trips/{id}/ (Hellō login required)
        bundle_ok:
          type: boolean
        bundle_error:
          type: string
    VersionList:
      type: object
      properties:
        id:
          type: string
        versions:
          type: array
          items:
            type: object
            properties:
              version_id:
                type: string
              last_modified:
                type: string
              is_latest:
                type: boolean
    RestoreRequest:
      type: object
      required:
        - version_id
      properties:
        version_id:
          type: string
    ChangeOvernightRequest:
      type: object
      required:
        - day
        - new_end
      additionalProperties: false
      properties:
        day:
          type: integer
          minimum: 1
          description: Travel day whose overnight end changes
        new_end:
          type: string
          description: Place id for the new overnight end (kebab-case)
        title:
          type: string
          description: Optional new title for day N
        also_update_next_start:
          type: boolean
          description: If true (default), set day N+1 route start to new_end and keep its mid/end stops
        force:
          type: boolean
          description: Bypass max overnight distance check (ferry/flight days only)
        places:
          type: object
          additionalProperties:
            type: object
          description: Optional catalog create/update; include new_end with title/lat/lon/type when creating
    ReplaceDayRoutesRequest:
      type: object
      additionalProperties: false
      required:
        - days
      properties:
        places:
          type: object
          description: >
            Optional place catalog upserts (kebab-case ids). New places need
            top-level title, lat, lon, and type — not under info.
          additionalProperties:
            $ref: "#/components/schemas/PlacePatch"
        days:
          type: object
          description: >
            Day-number string keys (e.g. "7"). Each entry replaces that day's
            full route. Include title when the overnight/endpoint changes.
            Typically update day N and day N+1 together. On each route, mark
            start/end lodging as overnight so the viewer can label Depart.
          minProperties: 1
          additionalProperties:
            type: object
            additionalProperties: false
            required:
              - route
            properties:
              title:
                type: string
              notes:
                type: string
              route:
                type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/StopRef"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

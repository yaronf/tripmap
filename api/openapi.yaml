openapi: 3.1.0
info:
  title: tripmap agent API
  version: 0.4.1
  description: |
    Authenticated itinerary API (MCP tools + optional REST). Schema v2: places
    catalog plus day route/stops as place refs. Notes are human-authored —
    put enrichment in places.id.info, not notes (usage rule, not enforced).
    Use update_day to change a day's title/notes/hike/ferry when the user asks.
    Human viewers sign in with Hellō, then use /me/trips/{id}/ (no capability tokens).
servers:
  - url: "{{BASE_URL}}"
paths:
  /health:
    get:
      operationId: health
      summary: Liveness
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/agent/schema:
    get:
      operationId: getSchema
      summary: Itinerary schema and version
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaInfo"
        "401":
          description: Unauthorized
  /api/agent/trips:
    get:
      operationId: listTrips
      summary: List itinerary IDs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Trip ID list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripList"
        "401":
          description: Unauthorized
    post:
      operationId: createTrip
      summary: Create itinerary
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutateResult"
        "401":
          description: Unauthorized
  /api/agent/trips/{id}:
    get:
      operationId: getTrip
      summary: Trip summary
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripSummary"
        "404":
          description: Not found
    patch:
      operationId: patchTrip
      summary: Patch places info, day narrative, or structure
      description: Prefer over putTripYAML. Use update_day for title/notes/hike/ferry. Enrich via places.id.info. Also upsert_stop, remove_stop, swap_days, insert_day, delete_day. Do not put enrichment in notes.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutateResult"
  /api/agent/trips/{id}/yaml:
    get:
      operationId: getTripYAML
      summary: Get raw YAML
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: YAML document
          content:
            text/plain:
              schema:
                type: string
    put:
      operationId: putTripYAML
      summary: Replace YAML (raw text body)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: Full itinerary YAML
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutateResult"
  /api/agent/trips/{id}/versions:
    get:
      operationId: listVersions
      summary: List YAML versions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionList"
  /api/agent/trips/{id}/restore:
    post:
      operationId: restoreVersion
      summary: Restore a prior YAML version
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutateResult"
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
    SchemaInfo:
      type: object
      properties:
        schema_version:
          type: integer
        description:
          type: string
        notes_policy:
          type: string
          description: Human-authored notes usage rule for agents (not enforced)
        fields:
          type: object
          additionalProperties:
            type: string
        patch_ops:
          type: array
          items:
            type: string
        days_patch_example:
          type: object
          additionalProperties: true
    TripList:
      type: object
      properties:
        trips:
          type: array
          items:
            type: string
    CreateTripRequest:
      type: object
      required:
        - id
        - yaml
      properties:
        id:
          type: string
        yaml:
          type: string
    TripSummary:
      type: object
      properties:
        id:
          type: string
        version_id:
          type: string
        schema_version:
          type: integer
        trip:
          type: string
        description:
          type: string
        start:
          type: string
        days:
          type: integer
    TripPatch:
      type: object
      description: |
        One or more structured ops. Prefer update_day for day narrative and
        places.<id>.info for enrichment.
      properties:
        swap_days:
          type: array
          description: Exactly two day numbers to swap
          items:
            type: integer
          minItems: 2
          maxItems: 2
        update_day:
          type: object
          description: Partial update of one existing day (omit fields to leave unchanged)
          required:
            - day
          properties:
            day:
              type: integer
            title:
              type: string
            notes:
              type: string
              description: Day narrative; set when the user asks to edit notes
            hike:
              type: boolean
            ferry:
              type: boolean
            photo:
              type: string
            photo_caption:
              type: string
        places:
          type: object
          description: Map of place id to partial place fields (info is deep-merged)
          additionalProperties:
            type: object
            properties:
              title:
                type: string
              lat:
                type: number
              lon:
                type: number
              type:
                type: string
              notes:
                type: string
              photo:
                type: string
              photo_caption:
                type: string
              maps_url:
                type: string
                description: Google Maps place URL for the viewer pin; when set, overrides lat/lon search
              info:
                $ref: "#/components/schemas/PlaceInfo"
        days:
          type: object
          description: Legacy map form; prefer update_day
          additionalProperties:
            type: object
            properties:
              title:
                type: string
              notes:
                type: string
                description: Human notes; agents should not modify unless asked
              hike:
                type: boolean
              ferry:
                type: boolean
        upsert_stop:
          type: object
          properties:
            day:
              type: integer
            list:
              type: string
              description: route or stops
            place:
              type: string
            type:
              type: string
            notes:
              type: string
            maps_url:
              type: string
              description: Optional Google Maps URL override on this stop ref
        remove_stop:
          type: object
          properties:
            day:
              type: integer
            list:
              type: string
              description: route, stops, or empty for both
            place:
              type: string
        delete_day:
          type: integer
        insert_day:
          type: object
          properties:
            after:
              type: integer
            day:
              type: object
              properties:
                title:
                  type: string
                notes:
                  type: string
                  description: Human-authored; agents should not set unless asked
                hike:
                  type: boolean
                ferry:
                  type: boolean
                route:
                  type: array
                  items:
                    $ref: "#/components/schemas/StopRef"
                stops:
                  type: array
                  items:
                    $ref: "#/components/schemas/StopRef"
    PlaceInfo:
      type: object
      description: Structured enrichment for a place (optional throughout)
      properties:
        source:
          type: object
          properties:
            generated_by:
              type: string
            generated_at:
              type: string
        links:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              title:
                type: string
              url:
                type: string
            required:
              - type
              - url
        stats:
          type: object
          properties:
            distance_km:
              type: number
            duration:
              type: string
            ascent_m:
              type: number
            difficulty:
              type: string
        logistics:
          type: object
          properties:
            parking:
              type: string
            booking_required:
              type: boolean
        facilities:
          type: object
          properties:
            toilets:
              type: boolean
            drinking_water:
              type: boolean
        warnings:
          type: array
          items:
            type: string
        highlights:
          type: array
          items:
            type: string
    StopRef:
      type: object
      properties:
        place:
          type: string
        type:
          type: string
        notes:
          type: string
        maps_url:
          type: string
          description: Optional per-stop Google Maps URL override for the viewer pin
      required:
        - place
    MutateResult:
      type: object
      properties:
        id:
          type: string
        version_id:
          type: string
        schema_version:
          type: integer
        viewer_url:
          type: string
          description: Signed-in tripmap viewer path /me/trips/{id}/ (Hellō login required)
        bundle_ok:
          type: boolean
        bundle_error:
          type: string
    VersionList:
      type: object
      properties:
        id:
          type: string
        versions:
          type: array
          items:
            type: object
            properties:
              version_id:
                type: string
              last_modified:
                type: string
              is_latest:
                type: boolean
    RestoreRequest:
      type: object
      required:
        - version_id
      properties:
        version_id:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

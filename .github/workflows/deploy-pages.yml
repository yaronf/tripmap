name: Deploy Pages

# Publishes a stub at this repo's Pages site only
# (typically https://yaronf.github.io/tripmap/ → https://www.sheffer.org/tripmap/
# when the *user* site owns www.sheffer.org). Does not bundle itineraries.
#
# Deliberately does NOT copy repo-root CNAME into the artifact: a project
# CNAME of www.sheffer.org would take over the whole host and fight other
# Pages properties. Leave custom domain on the user/org site, not this repo.

on:
  push:
    branches: [main]
    paths:
      - "pages-stub/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build stub site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp pages-stub/index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  tripmap durable edge: CloudFront in front of seasonal EC2 origin (HTTP).
  ACM cert must already exist in us-east-1. DNS (GoDaddy) CNAME for the
  public hostname is manual. After compute create, set OriginDomainName to
  tripmap-origin.sheffer.org (A→EIP) or the raw Elastic IP from compute outputs.

Parameters:
  ProjectName:
    Type: String
    Default: tripmap
    AllowedPattern: "^[a-z0-9-]+$"
  AlternateDomainName:
    Type: String
    Default: tripmap.sheffer.org
  AcmCertificateArn:
    Type: String
    Description: ACM certificate ARN in us-east-1 for AlternateDomainName
  OriginDomainName:
    Type: String
    Description: >
      EC2 origin hostname or Elastic IP (e.g. tripmap-origin.sheffer.org or
      the tripmap-compute ElasticIP output). CloudFront connects over HTTP :80.

Resources:
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} durable HTTPS (${AlternateDomainName})"
        Aliases:
          - !Ref AlternateDomainName
        HttpVersion: http2
        PriceClass: PriceClass_100
        IPV6Enabled: true
        DefaultRootObject: ""
        Origins:
          - Id: ec2-origin
            DomainName: !Ref OriginDomainName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              # Keep above the 30s default for slow origin / long MCP calls.
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: ec2-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # Managed-CachingDisabled
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewer — forward Host as viewer host; origin sees tripmap.sheffer.org
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Stack
          Value: edge

Outputs:
  DistributionId:
    Value: !Ref Distribution
    Export:
      Name: !Sub "${ProjectName}-CloudFrontDistributionId"
  DistributionDomainName:
    Description: Target for GoDaddy CNAME tripmap → this hostname
    Value: !GetAtt Distribution.DomainName
    Export:
      Name: !Sub "${ProjectName}-CloudFrontDomainName"
  PublicBaseURL:
    Value: !Sub "https://${AlternateDomainName}"
    Export:
      Name: !Sub "${ProjectName}-PublicBaseURL"
  OriginDomainName:
    Value: !Ref OriginDomainName

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  tripmap persistent data plane (eu-central-1): S3 itineraries + comments,
  agent Bearer / session / OpenAI secrets, and ECR. EC2 instance IAM lives
  in tripmap-compute.

Parameters:
  ProjectName:
    Type: String
    Default: tripmap
    AllowedPattern: "^[a-z0-9-]+$"
  # Created out-of-band (aws secretsmanager create-secret); not managed by this stack.
  OpenAISecretArn:
    Type: String
    Default: "arn:aws:secretsmanager:eu-central-1:077804408159:secret:tripmap/openai-Uy9vLX"
    Description: Secrets Manager ARN for OpenAI JSON {"api_key":"sk-..."}; injected as OPENAI_SECRET_JSON

Resources:
  ItinerariesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-itineraries-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Stack
          Value: data

  CommentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-comments-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Stack
          Value: data

  AgentBearerSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/agent-bearer"
      Description: Bearer token for tripmap agent API / MCP
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: token
        PasswordLength: 48
        ExcludeCharacters: '"@/\'
        RequireEachIncludedType: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  HelloSessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/hello-session"
      Description: HMAC key for tripmap Hellō session cookies (not the agent Bearer)
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: secret
        PasswordLength: 48
        ExcludeCharacters: '"@/\'
        RequireEachIncludedType: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}d"
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  ItinerariesBucketName:
    Description: Versioned itinerary YAML bucket
    Value: !Ref ItinerariesBucket
    Export:
      Name: !Sub "${ProjectName}-ItinerariesBucket"

  CommentsBucketName:
    Description: Unversioned comments bucket
    Value: !Ref CommentsBucket
    Export:
      Name: !Sub "${ProjectName}-CommentsBucket"

  AgentBearerSecretArn:
    Description: Secrets Manager ARN for agent Bearer token
    Value: !Ref AgentBearerSecret
    Export:
      Name: !Sub "${ProjectName}-AgentBearerSecretArn"

  HelloSessionSecretArn:
    Description: Secrets Manager ARN for Hellō session HMAC secret
    Value: !Ref HelloSessionSecret
    Export:
      Name: !Sub "${ProjectName}-HelloSessionSecretArn"

  OpenAISecretArnExport:
    Description: OpenAI secret ARN (OPENAI_SECRET_JSON for viewer chat)
    Value: !Ref OpenAISecretArn
    Export:
      Name: !Sub "${ProjectName}-OpenAISecretArn"

  EcrRepositoryUri:
    Description: ECR repository URI for tripmapd image
    Value: !GetAtt EcrRepository.RepositoryUri
    Export:
      Name: !Sub "${ProjectName}-EcrRepositoryUri"

  EcrRepositoryName:
    Value: !Ref EcrRepository
    Export:
      Name: !Sub "${ProjectName}-EcrRepositoryName"

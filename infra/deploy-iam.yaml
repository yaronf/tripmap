AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Least-privilege IAM for Cursor / day-to-day tripmap deploys. Primary
  policy tripmap-deploy plus tripmap-deploy-compute (EC2/SSM). Cannot
  administer the account or delete tripmap-data.

Parameters:
  ProjectName:
    Type: String
    Default: tripmap
    AllowedPattern: "^[a-z0-9-]+$"
  DeployUserName:
    Type: String
    Default: tripmap-deploy
    AllowedPattern: "^[\\w+=,.@-]+$"

Resources:
  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-deploy"
      Description: Day-to-day tripmap deploy / seed / smoke (not account admin)
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ECRAuth
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: "*"

          - Sid: ECRPushPull
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:CompleteLayerUpload
              - ecr:DescribeImages
              - ecr:DescribeRepositories
              - ecr:GetDownloadUrlForLayer
              - ecr:InitiateLayerUpload
              - ecr:ListImages
              - ecr:PutImage
              - ecr:UploadLayerPart
            Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}d"

          - Sid: CloudFormationCompute
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:CreateStack
              - cloudformation:DeleteChangeSet
              - cloudformation:DeleteStack
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResource
              - cloudformation:DescribeStackResources
              - cloudformation:DescribeStacks
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:ListChangeSets
              - cloudformation:ListStackResources
              - cloudformation:UpdateStack
            Resource:
              - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-compute/*"
              - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-compute"
              - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-edge/*"
              - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-edge"

          - Sid: CloudFormationReadDataAndList
            Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:ListExports
              - cloudformation:ListImports
              - cloudformation:GetTemplateSummary
            Resource: "*"

          - Sid: DenyDeleteDataStack
            Effect: Deny
            Action:
              - cloudformation:DeleteStack
            Resource:
              - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-data/*"
              - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-data"

          - Sid: CloudFrontOriginUpdate
            Effect: Allow
            Action:
              - cloudfront:GetDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:UpdateDistribution
              - cloudfront:ListDistributions
              - cloudfront:CreateInvalidation
            Resource: "*"

          - Sid: ItinerariesS3
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:ListBucketVersions
            Resource: !Sub "arn:aws:s3:::${ProjectName}-itineraries-${AWS::AccountId}-${AWS::Region}"

          - Sid: ItinerariesObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "arn:aws:s3:::${ProjectName}-itineraries-${AWS::AccountId}-${AWS::Region}/*"

          - Sid: CommentsS3
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource: !Sub "arn:aws:s3:::${ProjectName}-comments-${AWS::AccountId}-${AWS::Region}"

          - Sid: CommentsObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "arn:aws:s3:::${ProjectName}-comments-${AWS::AccountId}-${AWS::Region}/*"

          # Container stdout lands in Express/ECS log groups
          - Sid: CloudWatchLogsRead
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - logs:GetLogEvents
              - logs:FilterLogEvents
              - logs:StartQuery
              - logs:GetQueryResults
              - logs:StopQuery
            Resource: "*"

  # EC2 compute permissions (separate managed policy — IAM 6KB PolicySize quota).
  DeployPolicyCompute:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-deploy-compute"
      Description: EC2/SSM/IAM for tripmap-ec2 stack resources
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PassEC2Roles
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-ec2"
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-ec2-*"
            Condition:
              StringEquals:
                iam:PassedToService:
                  - ec2.amazonaws.com
                  - lambda.amazonaws.com
                  - cloudformation.amazonaws.com
          - Sid: ManageEC2Roles
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:CreateRole
              - iam:DeleteRole
              - iam:UpdateRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:ListRolePolicies
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:AddRoleToInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
              - iam:GetInstanceProfile
              - iam:TagInstanceProfile
            Resource:
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-ec2"
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-ec2-*"
              - !Sub "arn:aws:iam::${AWS::AccountId}:instance-profile/${ProjectName}-ec2"
          - Sid: EC2
            Effect: Allow
            Action:
              - ec2:RunInstances
              - ec2:TerminateInstances
              - ec2:StopInstances
              - ec2:StartInstances
              - ec2:RebootInstances
              - ec2:Describe*
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
              - ec2:AllocateAddress
              - ec2:ReleaseAddress
              - ec2:AssociateAddress
              - ec2:DisassociateAddress
              - ec2:ModifyInstanceAttribute
              - ec2:ReplaceIamInstanceProfileAssociation
              - ec2:AssociateIamInstanceProfile
              - ec2:DisassociateIamInstanceProfile
              - ec2:GetManagedPrefixListEntries
              - ec2:CreateLaunchTemplate
              - ec2:CreateLaunchTemplateVersion
              - ec2:DeleteLaunchTemplate
              - ec2:DeleteLaunchTemplateVersions
              - ec2:ModifyLaunchTemplate
              - ec2:GetLaunchTemplateData
            Resource: "*"
          - Sid: SSM
            Effect: Allow
            Action:
              - ssm:SendCommand
              - ssm:GetCommandInvocation
              - ssm:ListCommandInvocations
              - ssm:DescribeInstanceInformation
              - ssm:GetParameter
              - ssm:PutParameter
              - ssm:DeleteParameter
              - ssm:AddTagsToResource
              - ssm:RemoveTagsFromResource
              - ssm:ListTagsForResource
            Resource: "*"
          - Sid: LambdaEvents
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:ListTags
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:InvokeFunction
              - events:PutRule
              - events:DeleteRule
              - events:DescribeRule
              - events:PutTargets
              - events:RemoveTargets
              - events:TagResource
              - events:UntagResource
              - events:ListTagsForResource
            Resource:
              - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-ec2-*"
              - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${ProjectName}-ec2-*"

  # Group tripmap-deploy is managed outside this stack (created via CLI) so we
  # do not fight AlreadyExists on updates. Attach DeployPolicy +
  # DeployPolicyCompute + SignInLocalDevelopmentAccess to that group.
  DeployUser:
    Type: AWS::IAM::User
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserName: !Ref DeployUserName
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: day-to-day-deploy

Outputs:
  DeployUserName:
    Description: IAM user for Cursor / day-to-day tripmap work
    Value: !Ref DeployUser
  DeployUserArn:
    Value: !GetAtt DeployUser.Arn
  DeployPolicyArn:
    Value: !Ref DeployPolicy
  DeployPolicyComputeArn:
    Value: !Ref DeployPolicyCompute
  DeployGroupHint:
    Description: Attach both deploy policies + SignInLocalDevelopmentAccess to this group
    Value: !Ref DeployUserName
  NextSteps:
    Description: Finish console login outside CloudFormation
    Value: !Sub >
      Group ${DeployUserName}: attach ${ProjectName}-deploy,
      ${ProjectName}-deploy-compute, and SignInLocalDevelopmentAccess.
      Agent Bearer is NOT in these policies — use local .env only.

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  tripmap seasonal compute (eu-central-1): ECS Express Mode service.
  Delete this stack off-season to stop ALB/Fargate charges. Requires tripmap-data.

Parameters:
  ProjectName:
    Type: String
    Default: tripmap
    AllowedPattern: "^[a-z0-9-]+$"
  ImageTag:
    Type: String
    Default: latest
    Description: ECR image tag to run
  Cpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]
  Memory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048", "4096", "8192"]
  MinTaskCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
  MaxTaskCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 20
  HelloClientID:
    Type: String
    Default: ""
    Description: Hellō OAuth Client ID (public). Empty disables /auth/hello/*.
  GoogleSiteVerification:
    Type: String
    Default: ""
    Description: Optional Search Console HTML tag for tripmap.sheffer.org home page.

Resources:
  ExpressService:
    Type: AWS::ECS::ExpressGatewayService
    Properties:
      ServiceName: !Ref ProjectName
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-TaskExecutionRoleArn"
      InfrastructureRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-InfrastructureRoleArn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-TaskRoleArn"
      HealthCheckPath: /health
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      PrimaryContainer:
        Image: !Sub
          - "${RepoUri}:${ImageTag}"
          - RepoUri:
              Fn::ImportValue: !Sub "${ProjectName}-EcrRepositoryUri"
            ImageTag: !Ref ImageTag
        ContainerPort: 8080
        Environment:
          - Name: ADDR
            Value: ":8080"
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: ITINERARIES_BUCKET
            Value:
              Fn::ImportValue: !Sub "${ProjectName}-ItinerariesBucket"
          - Name: COMMENTS_BUCKET
            Value:
              Fn::ImportValue: !Sub "${ProjectName}-CommentsBucket"
          - Name: ROUTE_MODE
            Value: osrm
          - Name: PUBLIC_BASE_URL
            Value:
              Fn::ImportValue: !Sub "${ProjectName}-PublicBaseURL"
          - Name: HELLO_CLIENT_ID
            Value: !Ref HelloClientID
          - Name: HELLO_REDIRECT_URI
            Value: !Sub
              - "${Base}/auth/hello/callback"
              - Base:
                  Fn::ImportValue: !Sub "${ProjectName}-PublicBaseURL"
          - Name: GOOGLE_SITE_VERIFICATION
            Value: !Ref GoogleSiteVerification
          - Name: OPENAI_MODEL
            Value: gpt-5-mini
        Secrets:
          # Injects the JSON key "token" from tripmap/agent-bearer
          - Name: AGENT_BEARER_TOKEN
            ValueFrom: !Sub
              - "${SecretArn}:token::"
              - SecretArn:
                  Fn::ImportValue: !Sub "${ProjectName}-AgentBearerSecretArn"
          # Injects the JSON key "secret" from tripmap/hello-session
          - Name: HELLO_SESSION_SECRET
            ValueFrom: !Sub
              - "${SecretArn}:secret::"
              - SecretArn:
                  Fn::ImportValue: !Sub "${ProjectName}-HelloSessionSecretArn"
          # Injects full JSON; tripmapd reads api_key (empty/missing disables chat)
          - Name: OPENAI_SECRET_JSON
            ValueFrom:
              Fn::ImportValue: !Sub "${ProjectName}-OpenAISecretArn"
      ScalingTarget:
        MinTaskCount: !Ref MinTaskCount
        MaxTaskCount: !Ref MaxTaskCount
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Stack
          Value: compute

Outputs:
  ServiceArn:
    Description: Express Gateway service ARN
    Value: !GetAtt ExpressService.ServiceArn
  Endpoint:
    Description: HTTPS endpoint for the service (may change on redeploy)
    Value: !GetAtt ExpressService.Endpoint
  ServiceUrlHint:
    Description: Use https:// + Endpoint as PUBLIC_BASE_URL for the agent API / MCP
    Value: !Sub "https://${ExpressService.Endpoint}"
